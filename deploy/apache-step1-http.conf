# STEP 1 of 2 — port 80 only. Install this first, on its own.
#
#   sudo cp deploy/apache-MCP_HOST-step1-http.conf \
#        /etc/apache2/sites-available/MCP_HOST.conf
#   sudo a2ensite MCP_HOST
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Why in two stages: an SSL VirtualHost referencing a certificate file that
# does not exist yet makes `configtest` fail. On this host that would block the
# reload for *every* site in the config, TRACKING_HOST included. So the
# certificate is obtained while Apache only knows about port 80, and the SSL
# vhost is added afterwards (step 2).
#
# This vhost serves nothing but the ACME challenge, so it is safe to enable
# before the MCP service is even running.

<VirtualHost *:80>
    ServerName MCP_HOST

    # certbot writes its challenge files here; must resolve before the redirect.
    DocumentRoot /var/www/html

    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/MCP_HOST.error.log
    CustomLog ${APACHE_LOG_DIR}/MCP_HOST.access.log combined
</VirtualHost>
