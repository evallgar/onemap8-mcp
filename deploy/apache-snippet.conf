# Add these lines inside your EXISTING <VirtualHost *:443> block — the one that
# already serves your Onemap8 web app. Do not create a new vhost, a new
# subdomain, or a new certificate; this rides on what is already there.
#
# Placement matters: these must come BEFORE the catch-all
#
#     ProxyPass / http://localhost:8082/
#
# because Apache uses the first matching ProxyPass rule, and `/` matches
# everything including /mcp.
#
# Required modules (proxy and proxy_http are already enabled for the app;
# the rest are for streaming and header control):
#
#     sudo a2enmod proxy proxy_http headers env setenvif
#
# Apply with:
#
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#
# `configtest` must pass before reloading — a syntax error blocks the reload
# for every site on the host, not just this one.

    # --- Onemap8 MCP endpoint -------------------------------------------
    # Streamable HTTP replies as server-sent events. Apache buffers proxied
    # responses by default, which would hold each reply until the stream ends
    # and make every call appear to hang.
    <Location /mcp>
        SetEnv proxy-nobuffer 1
        SetEnv proxy-sendchunked 1
        SetEnvIfNoCase Request_URI ^/mcp no-gzip=1

        # Bearer tokens arrive here; refuse plaintext downgrades.
        Header always set Strict-Transport-Security "max-age=31536000"
    </Location>

    ProxyPass        /mcp http://127.0.0.1:3000/mcp retry=0 timeout=300
    ProxyPassReverse /mcp http://127.0.0.1:3000/mcp
    # --- end Onemap8 MCP endpoint ---------------------------------------


# The health check is served at /mcp/health by the same rule above, so no
# second ProxyPass is needed. Verify after reloading:
#
#     curl -s https://YOUR-HOST/mcp/health
#
# Do NOT add %{Authorization}i to any LogFormat on this vhost — it would write
# every customer's token to disk in plain text.
