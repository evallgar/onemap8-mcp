# STEP 2 of 2 — the SSL vhost. Only install this AFTER the certificate exists.
#
#   sudo certbot certonly --webroot -w /var/www/html -d MCP_HOST
#   sudo ls /etc/letsencrypt/live/MCP_HOST/fullchain.pem   # must exist
#
#   sudo cat deploy/apache-MCP_HOST-step2-ssl.conf \
#        >> /etc/apache2/sites-available/MCP_HOST.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# `certonly --webroot` is deliberate: it obtains the certificate without
# letting certbot rewrite the Apache config, so TRACKING_HOST's working
# vhost is never touched.
#
# Modules required (TRACKING_HOST already uses proxy, proxy_http, ssl
# and rewrite; the last three are what SSE streaming needs):
#   sudo a2enmod proxy proxy_http ssl rewrite headers env setenvif
#
# NOTE on the existing config: TRACKING_HOST uses `<VirtualHost
# _default_:443>`. Adding this `*:443` vhost alongside it makes Apache do
# name-based selection by SNI, which is correct, but Apache may warn about
# overlapping defaults. If it does, change the platform vhost's opening tag to
# `<VirtualHost *:443>` — the two forms must agree. Whichever vhost appears
# first becomes the fallback for unmatched hostnames; keep platform first.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName MCP_HOST
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/MCP_HOST/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/MCP_HOST/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Tester tokens travel in the Authorization header. Refuse plaintext.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300

    # Streamable HTTP answers as server-sent events. Apache buffers proxied
    # responses by default, which holds the whole reply until the stream ends
    # and makes every call look like it hung. These three lines are what make
    # streaming actually stream.
    SetEnv proxy-nobuffer 1
    SetEnv proxy-sendchunked 1
    SetEnvIfNoCase Request_URI ^/mcp no-gzip=1

    ProxyPass        /mcp    http://127.0.0.1:3000/mcp    retry=0
    ProxyPassReverse /mcp    http://127.0.0.1:3000/mcp

    ProxyPass        /health http://127.0.0.1:3000/health retry=0
    ProxyPassReverse /health http://127.0.0.1:3000/health

    # Nothing else on this host is public.
    ProxyPass /  !
    <Location />
        Require all denied
    </Location>
    <Location /mcp>
        Require all granted
    </Location>
    <Location /health>
        Require all granted
    </Location>

    # Do NOT add %{Authorization}i to this LogFormat — it would write every
    # tester's OneMap token to disk in plain text.
    ErrorLog  ${APACHE_LOG_DIR}/MCP_HOST.error.log
    CustomLog ${APACHE_LOG_DIR}/MCP_HOST.access.log combined
</VirtualHost>
</IfModule>
